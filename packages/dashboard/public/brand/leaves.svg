<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 900" width="460" height="900">
  <!-- A banana plant's crown, composed to balance the banana-saur on the
       opposite side of the canvas: broad blades arcing out of a shared base
       off the left edge. Set dressing in the brand greens, drawn in the same
       flat, outlined illustration language as the owner's mark. -->
  <defs>
    <g id="blade">
      <path d="M0 0 C 90 -34, 200 -40, 300 -8 C 340 5, 372 24, 392 48 C 330 66, 210 78, 110 58 C 62 48, 22 26, 0 0 Z"/>
      <path class="rib" d="M6 4 C 120 12, 260 22, 386 46" fill="none"/>
    </g>
  </defs>
  <!-- pseudostem, mostly off-canvas -->
  <path d="M-40 470 C 40 480, 96 520, 128 590 C 150 640, 156 700, 150 770 L 60 800 C 60 700, 30 600, -40 540 Z"
        fill="#4d7f40" stroke="#22391d" stroke-width="7"/>
  <!-- big upper blade, reaching up-right -->
  <use href="#blade" transform="translate(60 330) rotate(-38) scale(1.06)"
       fill="#3e6b34" stroke="#22391d" stroke-width="7"/>
  <!-- the crown's main blade, horizontal right -->
  <use href="#blade" transform="translate(70 480) rotate(-6) scale(1.15)"
       fill="#4d7f40" stroke="#22391d" stroke-width="7"/>
  <!-- drooping blade, down-right -->
  <use href="#blade" transform="translate(66 620) rotate(30) scale(0.98)"
       fill="#3e6b34" stroke="#22391d" stroke-width="7" opacity="0.92"/>
  <!-- small upright blade behind -->
  <use href="#blade" transform="translate(40 210) rotate(-64) scale(0.72)"
       fill="#5c8f4c" stroke="#22391d" stroke-width="7" opacity="0.85"/>
  <!-- young leaf still furled: a tight rolled blade -->
  <path d="M96 700 C 170 720, 240 770, 272 840 C 280 858, 272 874, 254 872 C 190 862, 124 800, 96 724 Z"
        fill="#5c8f4c" stroke="#22391d" stroke-width="7" opacity="0.8"/>
  <style>
    .rib { stroke: #22391d; stroke-width: 5; stroke-linecap: round; opacity: 0.55; }
  </style>
</svg>
